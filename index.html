<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TUMBUH">
<meta name="description" content="TUMBUH — pencatat keuangan 3 detik: jatah harian, amplop anggaran, target tabungan, dan kebiasaan uang orang sukses.">
<title>TUMBUH — Keuangan Naik Kelas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08090b;--card:#14171c;--card2:#191d23;--line:rgba(255,255,255,.075);
  --txt:#f3f5f7;--mut:#8b94a1;--gold:#e8b64b;--gold2:#f7d98c;
  --green:#4bd6a0;--red:#ff7d7d;--blue:#7fb0ff;--r:20px;
}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
:root{color-scheme:dark}
body{
  background:radial-gradient(120% 55% at 50% -8%,rgba(232,182,75,.10),transparent 62%),var(--bg);
  color:var(--txt);font-size:15px;line-height:1.45;overscroll-behavior-y:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.locked{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
#app{max-width:480px;margin:0 auto;padding:0 16px 104px;min-height:100vh}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 0 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:.22em}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px rgba(232,182,75,.8)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#12151a;color:var(--mut);display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.page{display:none;animation:fade .18s ease}
.page.active{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}

.ptitle{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px;display:flex;align-items:center;gap:10px}
.ptitle .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#12151a;color:var(--txt);display:grid;place-items:center;font-size:16px}

.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.big{font-size:26px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:19px 18px 16px;
  background:linear-gradient(158deg,#1d2018,#111318 58%);border:1px solid rgba(232,182,75,.16);
  box-shadow:0 18px 40px -24px rgba(0,0,0,.9)}
.hero:before{content:"";position:absolute;width:250px;height:250px;right:-100px;top:-130px;
  background:radial-gradient(circle,rgba(232,182,75,.26),transparent 65%);pointer-events:none}
.hero:after{content:"";position:absolute;left:-40px;bottom:-90px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(75,214,160,.07),transparent 65%);pointer-events:none}
.hrow{display:flex;justify-content:space-between;align-items:center;position:relative}
.hmonth{font-size:12px;color:var(--gold2);background:rgba(232,182,75,.08);border:1px solid rgba(232,182,75,.2);
  padding:3px 10px;border-radius:99px;font-weight:650;text-transform:capitalize}
.hbal{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:7px 0 12px;font-variant-numeric:tabular-nums;position:relative}
.hstats{display:flex;gap:22px;position:relative}
.hstat{display:flex;flex-direction:column;gap:1px}
.hstat .k{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.hstat .v{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.hstat.in .v{color:var(--green)}
.hstat.out .v{color:#ffb3b3}
.hdiv{height:1px;background:linear-gradient(90deg,transparent,rgba(232,182,75,.22),transparent);margin:14px 0 12px}
.hdaily{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative}
.hday{font-size:25px;font-weight:800;color:var(--gold2);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.hmeta{text-align:right;font-size:11.5px;color:var(--mut);line-height:1.5}
.hmeta b{color:var(--txt);font-weight:650}
.prog{height:8px;background:#252a31;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c9962f,#f7d98c);transition:width .3s}
.prog.red>i{background:linear-gradient(90deg,#c04b4b,#ff8f8f)}
.prog.green>i{background:linear-gradient(90deg,#2c9d74,#4bd6a0)}
.hero .prog{margin-top:12px;height:7px;background:rgba(255,255,255,.09)}
.hfoot{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--mut);position:relative}

.card{background:linear-gradient(180deg,#15181e,#111318);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card.tight{padding:14px 16px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.link{background:none;border:0;color:var(--gold);font-size:12.5px;font-weight:650;padding:4px 2px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sep{height:1px;background:var(--line);margin:16px 0}

/* quick repeat */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:99px;
  border:1px solid var(--line);background:#12151a;color:var(--txt);font-size:13px;font-weight:600;white-space:nowrap}
.qchip em{font-style:normal;color:var(--mut);font-weight:500;font-size:12px}

/* transactions */
.txlist{margin-top:2px}
.tx{display:flex;align-items:center;gap:11px;width:100%;padding:11px 0;border:0;background:none;color:inherit;text-align:left;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:13px;background:#1b1f26;border:1px solid rgba(255,255,255,.04);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.txmain{flex:1;min-width:0;display:flex;flex-direction:column}
.txmain b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txmain i{font-style:normal;font-size:11.5px;color:var(--mut);margin-top:1px}
.amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--green)}
.amt.out{color:#ffb3b3}
.txgroup{font-size:11.5px;color:var(--mut);font-weight:650;letter-spacing:.03em;padding:14px 0 2px}

.empty{text-align:center;padding:22px 12px;color:var(--mut);font-size:13px}
.empty .e{font-size:26px;display:block;margin-bottom:7px;opacity:.9}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#101318;border:1px solid var(--line);border-radius:15px;padding:5px;margin-bottom:14px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#101318;border:1px solid var(--line);border-radius:15px;padding:5px;margin-bottom:14px}
.segbtn{height:38px;border-radius:11px;border:0;background:none;color:var(--mut);font-size:13px;font-weight:650}
.seg4 .segbtn{font-size:12px;height:36px;padding:0}
.segbtn.on{background:#232830;color:var(--txt)}
.segbtn.on.out{background:rgba(255,125,125,.14);color:#ffb3b3}
.segbtn.on.in{background:rgba(75,214,160,.14);color:var(--green)}

/* catat */
.amountbox{padding:6px 2px 12px;text-align:right}
.amountbox .alabel{font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:700;text-transform:uppercase}
.amount{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.25;font-variant-numeric:tabular-nums;min-height:50px}
.amount .rp{font-size:17px;color:var(--mut);font-weight:600;letter-spacing:0;margin-right:4px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.key{height:52px;border-radius:14px;border:1px solid var(--line);background:#14171c;color:var(--txt);
  font-size:20px;font-weight:650;display:grid;place-items:center;user-select:none}
.key:active{background:#20252c;transform:scale(.98)}
.key.del{color:var(--mut);font-size:18px}
.catwrap{margin-bottom:12px}
.catwrap .lbl{margin-bottom:7px;display:block}
.chip{flex:0 0 auto;height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:#12151a;
  color:var(--mut);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:rgba(232,182,75,.14);border-color:rgba(232,182,75,.5);color:var(--gold2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--mut);font-weight:650;margin-bottom:6px}
.inp{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:#0f1216;color:var(--txt);padding:0 13px;font-size:16px;outline:none}
.inp:focus{border-color:rgba(232,182,75,.5)}
textarea.inp{height:auto;padding:11px 13px;resize:vertical;line-height:1.4}
.datewrap{position:relative}
.datebtn{display:flex;align-items:center;color:var(--txt)}
.dateover{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:transparent}
.dateover::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b94a1 50%),linear-gradient(135deg,#8b94a1 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;
  border:1px solid var(--line);background:#171b21;color:var(--txt);font-size:14.5px;font-weight:700}
.btn.gold{background:linear-gradient(160deg,#f6d68a,#d9a53a);color:#1c1405;border:0;box-shadow:0 10px 24px -10px rgba(217,165,58,.55)}
.btn.ghost{background:#15181e}
.btn.danger{background:rgba(255,125,125,.07);border-color:rgba(255,125,125,.28);color:#ff9b9b}
.btn.dim{opacity:.45}
.btn.sm{height:40px;font-size:13px;border-radius:12px;width:auto;padding:0 14px}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}

/* envelope */
.env{padding:12px 0;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:0}
.env .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.env .nm{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;min-width:0}
.env .nm .e{width:30px;height:30px;border-radius:10px;background:#1b1f26;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.env .num{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.env .num b{color:var(--txt);font-weight:650}
.env .prog{margin-top:8px;height:6px}
.envline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.envline:last-child{border-bottom:0}

/* guide */
.gtabs{display:flex;gap:6px;margin-bottom:12px}
.gt{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:#12151a;color:var(--mut);font-size:11.5px;font-weight:650}
.gt.on{color:var(--gold2);border-color:rgba(232,182,75,.45);background:rgba(232,182,75,.1)}
.grow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.grow .gname{display:flex;align-items:center;gap:8px;color:var(--txt)}
.gdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.gval{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px}
.gnote{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5}

/* goals */
.goal{padding:13px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal .gname{font-size:14px;font-weight:700}
.goal .gsub{font-size:11.5px;color:var(--mut);margin-top:1px}
.goal .pct{font-size:13px;font-weight:750;color:var(--gold2)}
.goal .prog{margin-top:9px;height:7px}
.goal .gfoot{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--mut)}

/* bills / debts */
.lineitem{padding:12px 0;border-bottom:1px solid var(--line)}
.lineitem:last-child{border-bottom:0}
.lineitem .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lineitem .nm{font-size:13.5px;font-weight:650}
.lineitem .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.lineitem .amt2{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.billright{text-align:right;flex:0 0 auto}
.brow{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:4px}
.brow .badge{margin-left:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:rgba(232,182,75,.1);border:1px solid rgba(232,182,75,.3);color:var(--gold2);margin-left:6px;vertical-align:1px}
.badge.due{background:rgba(255,125,125,.1);border-color:rgba(255,125,125,.3);color:#ffb3b3}
.badge.ok{background:rgba(75,214,160,.1);border-color:rgba(75,214,160,.28);color:var(--green)}

/* report */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mnav .m{font-size:17px;font-weight:750;text-transform:capitalize}
.mnav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#12151a;color:var(--txt);font-size:16px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.sumcell{background:#12151a;border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.sumcell .k{font-size:10px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;font-weight:700}
.sumcell .v{font-size:14px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.v-in{color:var(--green)}.v-out{color:#ffb3b3}.v-net{color:var(--gold2)}
.bars{display:flex;gap:8px;align-items:flex-end;height:132px;margin-top:16px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bbars{display:flex;gap:3px;align-items:flex-end;width:100%;height:100%}
.bbar{flex:1;border-radius:5px 5px 2px 2px;min-height:2px;background:#2a3038}
.bbar.in{background:linear-gradient(180deg,#4bd6a0,#2b8f6b)}
.bbar.out{background:linear-gradient(180deg,#ff8f8f,#b95050)}
.bbar.zero{height:2px!important;opacity:.4}
.blabel{font-size:10px;color:var(--mut);text-transform:capitalize}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}
.donutwrap{display:flex;align-items:center;gap:14px;margin-top:8px}
.donutbox{position:relative;width:150px;height:150px;flex:0 0 auto}
.donutbox canvas{width:150px;height:150px;display:block}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dcenter .k{font-size:9.5px;letter-spacing:.07em;color:var(--mut);font-weight:700;text-transform:uppercase}
.dcenter .v{font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.dlegend{flex:1;min-width:0}
.drow{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px}
.drow .dn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.drow .dv{font-variant-numeric:tabular-nums;font-weight:650;font-size:11px}
.catbar{padding:9px 0;border-bottom:1px solid var(--line)}
.catbar:last-child{border-bottom:0}
.catbar .top{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.catbar .prog{height:5px;margin-top:6px}
.insight{display:flex;gap:9px;font-size:12.5px;color:#c8ced6;padding:7px 0;line-height:1.5}
.insight b{color:var(--gold2);font-weight:700}

/* sukses */
.quotehero{border-radius:22px;padding:20px;background:linear-gradient(150deg,#20231a,#111318 70%);border:1px solid rgba(232,182,75,.18);position:relative;overflow:hidden}
.quotehero .q{font-size:16px;font-weight:650;line-height:1.5;letter-spacing:-.01em;margin:8px 0 10px}
.quotehero .by{font-size:11.5px;color:var(--gold2);font-weight:650}
.guru{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.guru:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:linear-gradient(160deg,#2a2f37,#181c22);border:1px solid rgba(232,182,75,.25);color:var(--gold2)}
.guru .gn{font-size:13.5px;font-weight:750;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.guru .gr{font-size:10.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.guru .gq{font-size:12.8px;color:#cfd5dc;margin:5px 0 6px;line-height:1.5;font-style:italic}
.guru .gp{font-size:11.5px;color:var(--mut);line-height:1.5}
.guru .gp b{color:var(--gold2);font-weight:650;font-style:normal}
.jar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 10px}
.jar span{display:block;height:100%}
.jrow{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--mut)}
.jrow b{color:var(--txt);font-weight:650}
.chal{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;text-align:left}
.chal:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid #333a44;flex:0 0 auto;display:grid;place-items:center;font-size:13px;color:#0d0f12}
.chal.done .chk{background:var(--gold);border-color:var(--gold)}
.chal .ct{font-size:12.5px;line-height:1.4}
.chal.done .ct{color:var(--mut);text-decoration:line-through}

/* nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.tabbar .inner{pointer-events:auto;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:rgba(9,10,13,.94);backdrop-filter:blur(20px);
  border-top:1px solid var(--line)}
.tab{background:none;border:0;color:#6d7683;font-size:10px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold)}
.tab.mid{margin-top:-24px;color:#1a1406}
.tab.mid .fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(155deg,#f8dc95,#d8a338);display:grid;place-items:center;
  box-shadow:0 10px 26px -8px rgba(232,182,75,.65),inset 0 1px 0 rgba(255,255,255,.5)}
.tab.mid .fab svg{stroke:#1a1406;stroke-width:2.2;width:24px;height:24px}
.tab.mid.on{color:#1a1406}

/* sheet / toast */
#modalRoot{position:fixed;inset:0;z-index:80;display:none}
#modalRoot.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.64)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#12151a;border:1px solid var(--line);
  border-bottom:0;border-radius:25px 25px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:#2b3139;margin:4px auto 14px}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sheet .hint{font-size:12px;color:var(--mut);margin:0 0 14px;line-height:1.5}
.sheet .amountview{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0 14px}
.qamts{display:flex;gap:7px;margin:8px 0 12px}
.qamts button{flex:1;height:38px;border-radius:11px;border:1px solid var(--line);background:#171b21;color:var(--txt);font-size:12.5px;font-weight:650}
#toast{position:fixed;left:50%;bottom:94px;transform:translate(-50%,16px);z-index:90;display:flex;align-items:center;gap:14px;
  max-width:92vw;background:#232830;border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:11px 16px;
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 14px 34px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--gold);font-weight:750;font-size:13px;padding:0;flex:0 0 auto}
#toast .tmsg{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:360px){
  .hbal{font-size:29px}.hday{font-size:21px}.amount{font-size:34px}
  .key{height:48px}.sumcell .v{font-size:12.5px}.seg4 .segbtn{font-size:11px}
  .donutbox,.donutbox canvas{width:126px;height:126px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><i></i>TUMBUH</div>
    <button class="iconbtn" data-act="settings" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7h.09A1.7 1.7 0 0 0 10.1 3.14V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
    </button>
  </header>

  <main>
    <section id="page-home" class="page active"><div id="homeWrap"></div></section>
    <section id="page-catat" class="page"><div id="catatWrap"></div></section>
    <section id="page-anggaran" class="page"><div id="angWrap"></div></section>
    <section id="page-laporan" class="page"><div id="lapWrap"></div></section>

  <nav class="tabbar">

        <span>Beranda</span>
      </button>

        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3.2"/><path d="M3 10.5h18"/><circle cx="17" cy="15.3" r="1.3"/></svg>
        <span>Anggaran</span>
      </button>
      <button class="tab mid" data-act="nav" data-page="catat" aria-label="Catat transaksi">
        <span class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>

        <span>Laporan</span>

        <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 5.5H5v1.7A3.3 3.3 0 0 0 8.3 10.5M16 5.5h3v1.7a3.3 3.3 0 0 1-3.3 3.3"/><path d="M12 13v4.2M8.7 20h6.6"/></svg>
        <span>Naik Kelas</span>
      </button>

</div>

<div id="modalRoot"></div>
<div id="toast"></div>
<noscript><p style="padding:20px">Aplikasi ini butuh JavaScript. Aktifkan lalu muat ulang.</p></noscript>

<script>
(function(){
'use strict';

/* ================= utils ================= */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var nf = new Intl.NumberFormat('id-ID');
var pad2 = function(n){ return String(n).padStart(2,'0'); };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
}); };
var todayISO = function(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
var isoOf = function(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
var thisMonth = function(){ return todayISO().slice(0,7); };
var shiftMonth = function(k,n){ var p=k.split('-'); var d=new Date(+p[0],(+p[1]-1)+n,1); return d.getFullYear()+'-'+pad2(d.getMonth()+1); };
var dim = function(k){ var p=k.split('-'); return new Date(+p[0],+p[1],0).getDate(); };
var fmt = function(n){ n=Math.round(n||0); return (n<0?'−Rp ':'Rp ')+nf.format(Math.abs(n)); };
var fmtShort = function(n){ n=Math.round(n||0); var a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(1).replace('.',',')+' M';
  if(a>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' jt';
  if(a>=1e3) return Math.round(n/1e3)+' rb';
  return String(n);
};
var monthLabel = function(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'}); };
var monthShort = function(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'short'}); };
function dateShort(iso){
  if(iso===todayISO()) return 'Hari ini';
  var y=new Date(); y.setDate(y.getDate()-1);
  if(iso===isoOf(y)) return 'Kemarin';
  var d=new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  var opt={day:'numeric',month:'short'};
  if(d.getFullYear()!==new Date().getFullYear()) opt.year='numeric';
  return d.toLocaleDateString('id-ID',opt);
}
function dateLong(iso){
  var d=new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  var opt={weekday:'long',day:'numeric',month:'long'};
  if(d.getFullYear()!==new Date().getFullYear()) opt.year='numeric';
  return d.toLocaleDateString('id-ID',opt);
}
function dateBtnLabel(iso){
  var d=new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return iso||'';
  var pre=iso===todayISO()?'Hari ini · ':'';
  return pre+d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

/* ================= data ================= */
var KEY='tumbuh.v1';
var DEFAULT_CATS={
  out:['Makan','Transport','Belanja','Tagihan','Kesehatan','Hiburan','Pendidikan','Rumah','Keluarga','Tabungan','Utang','Lainnya'],
  in:['Gaji','Bonus','Usaha','Investasi','Piutang','Hadiah','Lainnya']
};
var BUCKET={Makan:'need',Transport:'need',Tagihan:'need',Rumah:'need',Kesehatan:'need',Keluarga:'need',
  Belanja:'want',Hiburan:'want',Lainnya:'want',Pendidikan:'future',Tabungan:'future',Investasi:'future'};
var ICON={Makan:'🍜',Transport:'🛵',Belanja:'🛍️',Tagihan:'🧾',Kesehatan:'💊',Hiburan:'🎬',Pendidikan:'📚',
  Rumah:'🏠',Keluarga:'👨‍👩‍👧',Lainnya:'📦',Gaji:'💼',Bonus:'🎁',Usaha:'🏪',Investasi:'📈',Hadiah:'🎉',
  Tabungan:'🏦',Utang:'🤝',Piutang:'🤝'};
var COLORS=['#e8b64b','#7fb0ff','#4bd6a0','#ff8f6b','#c084fc','#f472b6','#38bdf8','#a3e635'];

function initState(){
  return {v:1,settings:{name:'',budget:0},tx:[],goals:[],debts:[],bills:[],budgets:{},
    cats:{out:DEFAULT_CATS.out.slice(),in:DEFAULT_CATS.in.slice()},
    challenge:[false,false,false,false,false,false,false],created:Date.now()};
}
function migrate(raw){
  var s=initState();
  if(!raw||typeof raw!=='object') return s;
  if(raw.settings&&typeof raw.settings==='object'){
    s.settings.name=typeof raw.settings.name==='string'?raw.settings.name:'';
    s.settings.budget=Math.max(0,+raw.settings.budget||0);
  }
  if(Array.isArray(raw.tx)) s.tx=raw.tx.filter(function(t){return t&&t.amount&&t.date;}).map(function(t){
    return {id:t.id||uid(),type:t.type==='in'?'in':'out',amount:Math.max(0,+t.amount||0),
      cat:t.cat||'Lainnya',note:t.note||'',date:t.date,ts:+t.ts||0,goalId:t.goalId||null};
  });
  if(Array.isArray(raw.goals)) s.goals=raw.goals.map(function(g){
    return {id:g.id||uid(),name:g.name||'Target',target:Math.max(0,+g.target||0),saved:Math.max(0,+g.saved||0),
      deadline:g.deadline||'',emoji:g.emoji||'🎯'};
  });
  if(Array.isArray(raw.debts)) s.debts=raw.debts.map(function(d){
    return {id:d.id||uid(),name:d.name||'Utang',kind:d.kind==='loan'?'loan':'debt',
      amount:Math.max(0,+d.amount||0),due:d.due||'',paid:!!d.paid};
  });
  if(Array.isArray(raw.bills)) s.bills=raw.bills.map(function(b){
    return {id:b.id||uid(),name:b.name||'Tagihan',amount:Math.max(0,+b.amount||0),
      dueDay:Math.min(31,Math.max(1,+b.dueDay||1)),cat:b.cat||'Tagihan',lastPaid:b.lastPaid||''};
  });
  if(raw.budgets&&typeof raw.budgets==='object'){
    Object.keys(raw.budgets).forEach(function(k){ var v=+raw.budgets[k]; if(v>0) s.budgets[k]=v; });
  }
  if(raw.cats&&Array.isArray(raw.cats.out)&&raw.cats.out.length) s.cats.out=raw.cats.out.slice();
  if(raw.cats&&Array.isArray(raw.cats.in)&&raw.cats.in.length) s.cats.in=raw.cats.in.slice();
  if(Array.isArray(raw.challenge)){
    for(var i=0;i<7;i++) s.challenge[i]=!!raw.challenge[i];
  }
  // pastikan kategori yang dipakai tetap ada
  s.tx.forEach(function(t){
    var arr=t.type==='in'?s.cats.in:s.cats.out;
    if(arr.indexOf(t.cat)<0) arr.push(t.cat);
  });
  Object.keys(s.budgets).forEach(function(c){ if(s.cats.out.indexOf(c)<0) s.cats.out.push(c); });
  return s;
}
function loadState(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return initState();
    return migrate(JSON.parse(raw));
  }catch(e){ return initState(); }
}
var S=loadState();
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast('Gagal menyimpan — penyimpanan penuh'); }
}

/* derived */
function txOf(m){ return S.tx.filter(function(t){ return t.date.slice(0,7)===m; }); }
function sumOf(arr,type){ return arr.reduce(function(a,t){ return a+(t.type===type?+t.amount:0); },0); }
function incOf(arr){ return sumOf(arr,'in'); }
function outOf(arr){ return sumOf(arr,'out'); }
function spentCat(cat,m){ return S.tx.filter(function(t){ return t.type==='out'&&t.cat===cat&&t.date.slice(0,7)===m; })
  .reduce(function(a,t){ return a+(+t.amount||0); },0); }

/* ================= ui primitives ================= */
var page='home', btab='env', guideMode='503020', viewMonth=thisMonth(), histQ='';

function go(p){
  page=p;
  $$('.page').forEach(function(el){ el.classList.toggle('active', el.id==='page-'+p); });
  $$('.tab').forEach(function(el){ el.classList.toggle('on', el.getAttribute('data-page')===p); });
  renderPage(p);
  window.scrollTo(0,0);
}
function renderPage(p){
  if(p==='home') renderHome();
  else if(p==='catat') renderCatat();
  else if(p==='anggaran') renderAnggaran();
  else if(p==='laporan') renderLaporan();
  else if(p==='sukses') renderSukses();
  else if(p==='riwayat') renderRiwayat();
}
function renderAll(){ renderPage(page); }

var toastTimer=null, undoCb=null;
function toast(msg,undo){
  var el=$('#toast');
  el.innerHTML='<span class="tmsg">'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Batalkan</button>':'');
  el.classList.add('on');
  undoCb=undo||null;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('on'); undoCb=null; }, undo?5000:2600);
}
function hideToast(){ $('#toast').classList.remove('on'); undoCb=null; clearTimeout(toastTimer); }

function openSheet(html){
  var r=$('#modalRoot');
  r.innerHTML='<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  r.classList.add('open');
  document.body.classList.add('locked');
  r.querySelector('.sheet').scrollTop=0;
}
function closeSheet(){
  var r=$('#modalRoot');
  r.classList.remove('open'); r.innerHTML='';
  document.body.classList.remove('locked');
}
function moneyInput(id,val,placeholder){
  return '<input class="inp" id="'+id+'" type="number" inputmode="numeric" min="0" step="1" placeholder="'+(placeholder||'0')+'" value="'+(val||'')+'">';
}
function sheetTitle(t,sub){ return '<h3>'+esc(t)+'</h3>'+(sub?'<p class="hint">'+sub+'</p>':''); }
function delBtn(label,act,id){ return '<button class="btn danger" data-act="'+act+'" data-id="'+id+'">'+esc(label)+'</button>'; }

/* ================= HOME ================= */
function txRow(t){
  var icon=ICON[t.cat]||(t.type==='in'?'💰':'📦');
  var label=t.note&&t.note.trim()?t.note:t.cat;
  return '<div class="tx" role="button" data-act="tx" data-id="'+t.id+'">'
    +'<span class="ico">'+icon+'</span>'
    +'<span class="txmain"><b>'+esc(label)+'</b><i>'+esc(t.cat)+' · '+esc(dateShort(t.date))+'</i></span>'
    +'<span class="amt '+t.type+'">'+(t.type==='in'?'+':'−')+fmt(t.amount)+'</span>'
    +'</div>';
}
function greeting(){
  var h=new Date().getHours();
  if(h<11) return 'Selamat pagi';
  if(h<15) return 'Selamat siang';
  if(h<19) return 'Selamat sore';
  return 'Selamat malam';
}
var QUOTES=[
  {q:'Jangan menabung sisa belanja — belanjakan sisa setelah menabung.',by:'Warren Buffett'},
  {q:'Aturan pertama compounding: jangan pernah menghentikannya tanpa perlu.',by:'Charlie Munger'},
  {q:'Rasa sakit + refleksi = kemajuan. Catat, tinjau, perbaiki.',by:'Ray Dalio'},
  {q:'Orang kaya membeli aset. Orang biasa membeli barang yang terlihat seperti aset.',by:'Robert Kiyosaki'},
  {q:'Kebebasan finansial dimulai saat kamu tahu ke mana setiap rupiah pergi.',by:'T. Harv Eker'},
  {q:'Bukan berapa banyak yang kamu hasilkan, tapi berapa banyak yang kamu pertahankan.',by:'Prinsip hidup hemat'}
];
function quoteOfDay(){
  var d=new Date(); var start=new Date(d.getFullYear(),0,0);
  var n=Math.floor((d-start)/86400000);
  return QUOTES[n%QUOTES.length];
}
function renderHome(){
  var m=thisMonth(), list=txOf(m), inc=incOf(list), out=outOf(list), bal=inc-out;
  var budget=Math.max(0,+S.settings.budget||0);
  var today=todayISO(), dayN=+today.slice(8,10), leftDays=dim(m)-dayN+1;
  var spentToday=outOf(S.tx.filter(function(t){ return t.date===today; }));
  var remain=budget?Math.max(0,budget-out):0;
  var beforeToday=out-spentToday;
  var perDay=budget?Math.max(0,budget-beforeToday)/leftDays:0;
  var todayLeft=budget?perDay-spentToday:0;
  var pctUsed=budget?Math.min(100,out/budget*100):0;
  var over=budget&&out>budget;

  var h='';
  h+='<div class="row between" style="margin:4px 2px 12px">'
   +'<div><div style="font-size:19px;font-weight:800;letter-spacing:-.02em">'+greeting()+(S.settings.name?', '+esc(S.settings.name):'')+'</div>'
   +'<div class="small mut" style="text-transform:capitalize">'+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})+'</div></div>'
   +'</div>';

  h+='<section class="hero">'
   +'<div class="hrow"><span class="lbl" style="color:#c9b98a">Saldo bulan ini</span><span class="hmonth">'+monthLabel(m)+'</span></div>'
   +'<div class="hbal" style="color:'+(bal<0?'#ffb3b3':'#fff')+'">'+fmt(bal)+'</div>'
   +'<div class="hstats">'
   +'<div class="hstat in"><span class="k">↑ Masuk</span><span class="v">'+fmt(inc)+'</span></div>'
   +'<div class="hstat out"><span class="k">↓ Keluar</span><span class="v">'+fmt(out)+'</span></div>'
   +'</div>';
  if(budget){
    var overDay=todayLeft<0;
    h+='<div class="hdiv"></div>'
     +'<div class="hdaily"><div><span class="lbl" style="color:#c9b98a">Jatah hari ini</span>'
     +'<div class="hday" style="color:'+(overDay?'#ffb3b3':'var(--gold2)')+'">'+(overDay?'−':'')+fmt(Math.abs(todayLeft))+'</div></div>'
     +'<div class="hmeta"><b>'+fmt(perDay)+'</b>/hari<br>'+leftDays+' hari lagi</div></div>'
     +'<div class="prog'+(over?' red':'')+'"><i style="width:'+pctUsed.toFixed(1)+'%"></i></div>'
     +'<div class="hfoot"><span>Terpakai '+fmt(out)+'</span><span>dari '+fmt(budget)+'</span></div>';
  }else{
    h+='<div class="hdiv"></div><div class="hfoot" style="margin-top:0"><span>Atur anggaran untuk melihat jatah harian</span></div>';
  }
  h+='</section>';

  if(!budget){
    h+='<div class="card tight" style="display:flex;gap:12px;align-items:center">'
     +'<div style="font-size:22px">🎯</div><div style="flex:1"><b style="font-size:13.5px">Mulai dari satu angka</b>'
     +'<div class="small mut" style="margin-top:2px">Isi anggaran bulanan, app hitung jatah harianmu otomatis.</div></div>'
     +'<button class="btn gold sm" data-act="editBudget">Atur</button></div>';
  }

  var recent=S.tx.slice().sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?1:-1;
    return (b.ts||0)-(a.ts||0);
  }).slice(0,6);
  var seen={}, quick=[];
  recent.forEach(function(t){
    var k=t.type+'|'+t.cat+'|'+t.amount;
    if(!seen[k]&&quick.length<4){ seen[k]=1; quick.push(t); }
  });
  if(quick.length && page==='home'){
    h+='<div style="margin:16px 0 2px"><div class="lbl" style="margin-bottom:7px">Catat lagi · sekali sentuh</div><div class="chips">';
    quick.forEach(function(t){
      h+='<button class="qchip" data-act="repeat" data-id="'+t.id+'">'+(ICON[t.cat]||'📦')+' '+esc(t.cat)+' <em>'+fmt(t.amount)+'</em></button>';
    });
    h+='</div></div>';
  }

  var bills=upcomingBills();
  if(bills.length){
    h+='<div class="card"><div class="cardhead"><span class="lbl">Tagihan mendatang</span><span class="small mut">'+bills.length+' item</span></div>';
    bills.forEach(function(b){
      h+='<div class="lineitem"><div class="top"><div><div class="nm">'+esc(b.name)+'</div>'
       +'<div class="sub">'+b.label+' · '+esc(b.cat)+'</div></div>'
       +'<div style="text-align:right"><div class="amt2">'+fmt(b.amount)+'</div>'
       +(b.paid?'':'<button class="btn sm ghost" style="margin-top:5px" data-act="payBill" data-id="'+b.id+'">Bayar</button>')
       +'</div></div></div>';
    });
    h+='</div>';
  }

  var activeGoals=S.goals.filter(function(g){ return g.saved<g.target; });
  if(activeGoals.length){
    var g=activeGoals[0], gp=g.target?Math.min(100,g.saved/g.target*100):0;

function upcomingBills(){
  var now=new Date(), mk=thisMonth(), res=[];
  S.bills.forEach(function(b){
    var paid=b.lastPaid===mk;
    var day=Math.min(b.dueDay,dim(mk));
    var due=new Date(now.getFullYear(),now.getMonth(),day);
    var base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var diff=Math.round((due-base)/86400000);
    if(!paid&&diff<=7){
      res.push({id:b.id,name:b.name,amount:b.amount,cat:b.cat,paid:false,diff:diff,
        label:diff<0?'Lewat '+(Math.abs(diff))+' hari':diff===0?'Jatuh tempo hari ini':'Dalam '+diff+' hari'});
    }
  });
  return res.sort(function(a,b){ return a.diff-b.diff; });
}

function updateAmount(){
  var el=$('#amtBig');
  if(el) el.innerHTML='<span class="rp">Rp</span> '+(draft.amount?nf.format(+draft.amount):'0');

  if(b){
    b.textContent=draft.amount?'Simpan · '+fmt(+draft.amount):'Simpan';
    b.classList.toggle('dim',!draft.amount);
  }
}
function pressKey(k){
  if(k==='del'){ draft.amount=draft.amount.slice(0,-1); }
  else if(k==='000'){ if(draft.amount) draft.amount=String(Math.min(999999999999, +draft.amount*1000)); }
  else{
    if(draft.amount==='0') draft.amount='';
    if(draft.amount.length<12) draft.amount+=k;
  }
  if(draft.amount==='0'&&k!=='0') draft.amount='';
  if(navigator.vibrate) try{ navigator.vibrate(6); }catch(e){}
  updateAmount();
}
function saveTx(){
  var amount=parseInt(draft.amount||'0',10);
  if(!amount){ toast('Isi jumlah dulu'); return; }
  var tx={id:uid(),type:draft.type,amount:amount,cat:draft.cat,note:(draft.note||'').trim(),
    date:draft.date||todayISO(),ts:Date.now()};
  S.tx.push(tx); save();
  draft.amount=''; draft.note='';
  go('home');
  toast(fmt(amount)+' tercatat · '+tx.cat, function(){
    S.tx=S.tx.filter(function(x){ return x.id!==tx.id; }); save(); renderAll();
  });
}

    });
  }
  h+='</div>';

  // insights

  if(biggest) h+='<div class="insight"><span>🔍</span><div>Kategori terbesar: <b>'+esc(biggest.name)+'</b> ('+Math.round(biggest.value/out*100)+'% dari pengeluaran).</div></div>';
  if(out) h+='<div class="insight"><span>📅</span><div>Rata-rata belanja <b>'+fmt(avg)+'</b> per hari aktif ('+activeDays+' hari tercatat).</div></div>';
  if(pout) h+='<div class="insight"><span>'+(out>pout?'📈':'📉')+'</span><div>Pengeluaran '+(out>pout?'naik':'turun')+' <b>'+Math.abs(prevDiff).toFixed(1)+'%</b> dibanding '+monthLabel(prev)+'.</div></div>';
  if(inc) h+='<div class="insight"><span>🏦</span><div>Dari pemasukan, <b>'+Math.round(rate)+'%</b> belum terpakai. Target sehat: simpan minimal 20%.</div></div>';
  h+='</div>';

  h+='<button class="btn ghost" data-act="exportCSV" style="margin-top:12px">⬇ Ekspor CSV bulan ini</button>';
  h+='<button class="btn ghost" data-act="exportCSVAll" style="margin-top:8px">⬇ Ekspor semua transaksi</button>';
  $('#lapWrap').innerHTML=h;

  if(out){ requestAnimationFrame(function(){ drawDonut($('#donut'),donutData); }); }
}

function drawDonut(cv,data){
  if(!cv) return;
  var dpr=window.devicePixelRatio||1;
  var size=cv.clientWidth||150;
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr);
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  var cx=size/2, cy=size/2, r=size/2-4, ir=r*0.66;
  ctx.clearRect(0,0,size,size);
  var total=data.reduce(function(a,d){ return a+d.value; },0);
  ctx.beginPath(); ctx.arc(cx,cy,(r+ir)/2,0,Math.PI*2); ctx.strokeStyle='#242a31'; ctx.lineWidth=r-ir; ctx.stroke();
  if(!total) return;
  var start=-Math.PI/2;
  data.forEach(function(d){
    var ang=d.value/total*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,(r+ir)/2,start,start+ang);
    ctx.strokeStyle=d.color; ctx.lineWidth=r-ir; ctx.lineCap='butt'; ctx.stroke();
    start+=ang;
  });
}

    if(a.date!==b.date) return a.date<b.date?1:-1;

    if(!q) return true;

/* ================= EXPORT ================= */
function download(name,text,mime){
  try{
    var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
    toast('File '+name+' diunduh');
  }catch(e){ toast('Gagal mengunduh — coba Salin JSON'); }
}
function csvOf(list){
  var rows=[['tanggal','jenis','kategori','catatan','jumlah']];
  list.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(t){
    rows.push([t.date,t.type==='in'?'masuk':'keluar',t.cat,(t.note||'').replace(/"/g,'""'),String(t.amount)]);
  });
  return '\uFEFF'+rows.map(function(r){
    return r.map(function(v){ return /[",;\n]/.test(v)?'"'+v+'"':v; }).join(',');
  }).join('\r\n');
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('Disalin ke clipboard'); },function(){ fallbackCopy(txt); });
  }else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Disalin ke clipboard'); }
  catch(e){ toast('Tidak bisa menyalin — pakai Unduh JSON'); }
  ta.remove();
}

/* ================= ACTIONS ================= */
function act(name,el){
  var id=el.getAttribute('data-id'), v=el.getAttribute('data-v'), c=el.getAttribute('data-c');
  switch(name){
    case 'nav': go(el.getAttribute('data-page')); break;
    case 'closeSheet': closeSheet(); break;
    case 'settings': sheetSettings(); break;
    case 'undo':
      if(undoCb){ var f=undoCb; undoCb=null; f(); }
      hideToast(); break;
    case 'type':
      draft.type=v;
      draft.cat=(v==='out'?S.cats.out:S.cats.in)[0];
      renderCatat(); break;
    case 'key': pressKey(el.getAttribute('data-k')); break;
    case 'cat':
      draft.cat=c; renderCatat(); break;
    case 'saveTx': saveTx(); break;
    case 'repeat':
      var src=S.tx.filter(function(t){ return t.id===id; })[0];
      if(!src) return;
      var rt={id:uid(),type:src.type,amount:src.amount,cat:src.cat,note:src.note,date:todayISO(),ts:Date.now()};
      S.tx.push(rt); save(); go('home');
      toast(fmt(rt.amount)+' · '+rt.cat+' tercatat', function(){
        S.tx=S.tx.filter(function(x){ return x.id!==rt.id; }); save(); renderAll();
      });
      break;
    case 'tx': sheetTx(id); break;
    case 'txEdit': sheetTxEdit(id); break;
    case 'txUpdate':
      var ut=S.tx.filter(function(x){ return x.id===id; })[0];
      if(!ut) return;
      var ua=parseInt(($('#editAmount')||{}).value||'0',10)||0;
      if(!ua){ toast('Isi jumlah'); return; }
      var oldAmt=ut.amount;
      ut.amount=ua;
      ut.cat=($('#editCat')||{}).value||ut.cat;
      ut.note=((($('#editNote')||{}).value)||'').trim();
      ut.date=($('#editDate')||{}).value||ut.date;
      if(ut.goalId){
        var ug=S.goals.filter(function(x){ return x.id===ut.goalId; })[0];
        if(ug) ug.saved=Math.max(0,ug.saved+(ua-oldAmt));
      }
      save(); closeSheet(); renderAll(); toast('Perubahan disimpan'); break;
    case 'txDelete':
      var t=S.tx.filter(function(x){ return x.id===id; })[0];
      if(t&&t.goalId){ var g=S.goals.filter(function(x){ return x.id===t.goalId; })[0]; if(g) g.saved=Math.max(0,g.saved-t.amount); }
      S.tx=S.tx.filter(function(x){ return x.id!==id; });
      save(); closeSheet(); renderAll(); toast('Transaksi dihapus'); break;
    case 'txDuplicate':
      var d=S.tx.filter(function(x){ return x.id===id; })[0];
      if(!d) return;
      S.tx.push({id:uid(),type:d.type,amount:d.amount,cat:d.cat,note:d.note,date:todayISO(),ts:Date.now()});
      save(); closeSheet(); go('home'); toast('Diduplikat ke hari ini'); break;
    case 'editBudget': sheetBudget(); break;
    case 'saveBudget':
      var bv=Math.max(0,parseInt(($('#budgetIn')||{}).value||'0',10)||0);
      S.settings.budget=bv; save(); closeSheet(); renderAll(); toast('Anggaran: '+fmt(bv)); break;
    case 'btab': btab=v; renderAnggaran(); break;
    case 'guide': guideMode=v; renderAnggaran(); break;
    case 'editEnv': sheetEnv(c); break;
    case 'saveEnv':
      var ev=Math.max(0,parseInt(($('#envIn')||{}).value||'0',10)||0);
      if(ev) S.budgets[c]=ev; else delete S.budgets[c];
      save(); closeSheet(); renderAnggaran(); break;
    case 'clearEnv': delete S.budgets[c]; save(); closeSheet(); renderAnggaran(); break;
    case 'addCat': sheetAddCat(); break;
    case 'saveCat':
      var cn=($('#catName')||{}).value||''; cn=cn.trim();
      var ct=($('#catType')||{}).value||'out';
      if(!cn){ toast('Nama kategori kosong'); return; }
      var arr=ct==='in'?S.cats.in:S.cats.out;
      if(arr.indexOf(cn)>=0){ toast('Kategori sudah ada'); return; }
      arr.push(cn); save(); closeSheet(); renderAll(); toast('Kategori "'+cn+'" ditambahkan'); break;
    case 'addGoal': sheetGoal(); break;
    case 'saveGoal':
      var gn=(($('#goalName')||{}).value||'').trim();
      var gt=Math.max(0,parseInt(($('#goalTarget')||{}).value||'0',10)||0);
      if(!gn){ toast('Nama target kosong'); return; }
      if(!gt){ toast('Isi target nominal'); return; }
      S.goals.push({id:uid(),name:gn,target:gt,saved:0,deadline:(($('#goalDeadline')||{}).value||''),emoji:'🎯'});
      save(); closeSheet(); btab='target'; renderAll(); toast('Target dibuat'); break;
    case 'fund': sheetFund(id); break;
    case 'qamt':
      var qi=$('#fundIn'); if(qi) qi.value=v; break;
    case 'saveFund':
      var fid=id, fa=Math.max(0,parseInt(($('#fundIn')||{}).value||'0',10)||0);
      var fg=S.goals.filter(function(x){ return x.id===fid; })[0];
      if(!fg) return;
      if(!fa){ toast('Isi jumlah'); return; }
      var ftx={id:uid(),type:'out',amount:fa,cat:'Tabungan',note:'Nabung · '+fg.name,date:todayISO(),ts:Date.now(),goalId:fg.id};
      S.tx.push(ftx); fg.saved+=fa; save(); closeSheet(); renderAll();
      toast('Nabung '+fmt(fa)+' · '+fg.name, function(){
        S.tx=S.tx.filter(function(x){ return x.id!==ftx.id; });
        fg.saved=Math.max(0,fg.saved-fa); save(); renderAll();
      });
      break;
    case 'delGoal':
      var dg=S.goals.filter(function(x){ return x.id===id; })[0];
      if(dg&&confirm('Hapus target "'+dg.name+'"? Transaksi tabungannya tetap ada.')){
        S.goals=S.goals.filter(function(x){ return x.id!==id; }); save(); renderAll();
      }
      break;
    case 'addDebt': sheetDebt(el.getAttribute('data-kind')||'debt'); break;
    case 'delDebt':
      var dd=S.debts.filter(function(x){ return x.id===id; })[0];
      if(dd&&confirm('Hapus catatan "'+dd.name+'"?')){ S.debts=S.debts.filter(function(x){ return x.id!==id; }); save(); renderAll(); }
      break;
    case 'saveDebt':
      var dn=(($('#debtName')||{}).value||'').trim();
      var da=Math.max(0,parseInt(($('#debtAmount')||{}).value||'0',10)||0);
      if(!dn){ toast('Isi nama'); return; }
      if(!da){ toast('Isi jumlah'); return; }
      S.debts.push({id:uid(),name:dn,kind:el.getAttribute('data-kind')||'debt',amount:da,
        due:(($('#debtDue')||{}).value||''),paid:false});
      save(); closeSheet(); btab='utang'; renderAll(); toast('Tercatat'); break;
    case 'payDebt': sheetPayDebt(id); break;
    case 'payDebtNow':
      var pd=S.debts.filter(function(x){ return x.id===id; })[0];
      if(!pd) return;
      var ptx={id:uid(),type:pd.kind==='debt'?'out':'in',amount:pd.amount,
        cat:pd.kind==='debt'?'Utang':'Piutang',note:(pd.kind==='debt'?'Bayar · ':'Terima · ')+pd.name,
        date:todayISO(),ts:Date.now()};
      S.tx.push(ptx); pd.paid=true; save(); closeSheet(); renderAll();
      toast('Lunas · '+pd.name, function(){
        S.tx=S.tx.filter(function(x){ return x.id!==ptx.id; }); pd.paid=false; save(); renderAll();
      });
      break;
    case 'addBill': sheetBill(); break;
    case 'saveBill':
      var bn=(($('#billName')||{}).value||'').trim();
      var ba=Math.max(0,parseInt(($('#billAmount')||{}).value||'0',10)||0);
      var bd=Math.min(31,Math.max(1,parseInt(($('#billDay')||{}).value||'1',10)||1));
      var bc=($('#billCat')||{}).value||'Tagihan';
      if(!bn){ toast('Isi nama tagihan'); return; }
      if(!ba){ toast('Isi jumlah'); return; }
      S.bills.push({id:uid(),name:bn,amount:ba,dueDay:bd,cat:bc,lastPaid:''});
      save(); closeSheet(); btab='rutin'; renderAll(); toast('Tagihan ditambahkan'); break;
    case 'payBill':
      var pb=S.bills.filter(function(x){ return x.id===id; })[0];
      if(!pb) return;
      var prevPaid=pb.lastPaid, mk=thisMonth();
      var btx={id:uid(),type:'out',amount:pb.amount,cat:pb.cat,note:'Bayar · '+pb.name,date:todayISO(),ts:Date.now()};
      S.tx.push(btx); pb.lastPaid=mk; save(); renderAll();
      toast('Dibayar · '+pb.name, function(){
        S.tx=S.tx.filter(function(x){ return x.id!==btx.id; }); pb.lastPaid=prevPaid; save(); renderAll();
      });
      break;
    case 'delBill':
      var db=S.bills.filter(function(x){ return x.id===id; })[0];
      if(db&&confirm('Hapus tagihan "'+db.name+'"?')){ S.bills=S.bills.filter(function(x){ return x.id!==id; }); save(); renderAll(); }
      break;
    case 'lm': viewMonth=shiftMonth(viewMonth,parseInt(v||el.getAttribute('data-d'),10)); renderLaporan(); break;
    case 'chal':
      var ci=+el.getAttribute('data-i'); S.challenge[ci]=!S.challenge[ci]; save(); renderSukses(); break;
    case 'exportCSV':
      download('tumbuh-'+viewMonth+'.csv',csvOf(txOf(viewMonth)),'text/csv;charset=utf-8'); break;
    case 'exportCSVAll':
      download('tumbuh-semua.csv',csvOf(S.tx),'text/csv;charset=utf-8'); break;
    case 'exportJSON':
      download('tumbuh-backup-'+todayISO()+'.json',JSON.stringify(S,null,2),'application/json'); break;
    case 'copyJSON': copyText(JSON.stringify(S)); break;
    case 'importJSON':
      var raw=($('#impBox')||{}).value||'';
      if(!raw.trim()){ toast('Tempel JSON dulu'); return; }
      try{
        var obj=JSON.parse(raw);
        if(!obj||!Array.isArray(obj.tx)) throw new Error('bukan backup TUMBUH');
        if(!confirm('Ganti data saat ini dengan isi cadangan?')) return;
        S=migrate(obj); save(); closeSheet(); go('home'); toast('Data dipulihkan');
      }catch(e){ toast('JSON tidak valid'); }
      break;
    case 'saveSettings':
      S.settings.name=((($('#setName')||{}).value||'')).trim().slice(0,20);
      S.settings.budget=Math.max(0,parseInt(($('#setBudget')||{}).value||'0',10)||0);
      save(); closeSheet(); renderAll(); toast('Pengaturan disimpan'); break;
    case 'reset':
      if(confirm('Hapus SEMUA data? Tindakan ini tidak bisa dibatalkan.')){
        localStorage.removeItem(KEY); S=initState(); save(); closeSheet(); go('home'); toast('Data dihapus');
      }
      break;
  }
}

/* ================= EVENTS ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  e.preventDefault();
  try{ act(el.getAttribute('data-act'),el); }
  catch(err){ console.error(err); toast('Ada yang salah. Coba lagi.'); }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='noteInput') draft.note=t.value;
  else if(t.id==='dateInput'){ draft.date=t.value||todayISO(); var dl=$('#dateLabel'); if(dl) dl.textContent=dateBtnLabel(draft.date); }
  else if(t.id==='histSearch'){ histQ=t.value; renderHistList(); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeSheet(); }
});

/* ================= INIT ================= */
renderPage('home');
if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches){ /* PWA */ }
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
